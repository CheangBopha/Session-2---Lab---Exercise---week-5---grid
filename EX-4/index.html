<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Electronic Products</h1>

    <div class="products">

        <div class="product">
            <img src="laptop.jpg" alt="Laptop">
            <h3>Laptop</h3>
            <p>Powerful laptop for study, work, and entertainment.</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="Smartphone.jpg" alt="Phone">
            <h3>Smart Phone</h3>
            <p>Modern smartphone with excellent camera quality.</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="Tablets.jpg" alt="Tablet">
            <h3>Tablet</h3>
            <p>Portable tablet perfect for reading and watching videos.</p>
            <button>Buy Now</button>
        </div>

        <div class="product">
            <img src="Headphone.jpg" alt="Headphone">
            <h3>Headphones</h3>
            <p>High-quality headphones with clear sound effects.</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
